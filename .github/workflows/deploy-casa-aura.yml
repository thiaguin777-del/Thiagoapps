name: Deploy Casa Aura

on:
  push:
    branches: ["manus/production-hardening", "main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casa-aura-ultra
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: casa-aura-ultra/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Build standalone HTML
        env:
          VITE_CASA_AURA_WHATSAPP: ${{ vars.CASA_AURA_WHATSAPP }}
        run: npm run build:unico
      - name: Prepare Pages artifact
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp casa-aura.html deploy/index.html
          cp -R public/. deploy/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: casa-aura-ultra/deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
